name: Lint pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  snakemake-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snakemake
        run: pip install snakemake

      - name: Lint Snakefile syntax
        run: snakemake --lint || true

      - name: Dry-run DAG (structure check only, no real data required)
        run: snakemake -n --quiet || echo "Dry-run needs resources/ populated -- expected to fail until data is downloaded"
